<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio — Header</title>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root{
            --ink:#12172B;
            --bone:#F6F3EC;
            --amber:#E8A33D;
            --slate:#6B7280;
            --teal:#2FA6A0;
            --line: rgba(18,23,43,0.12);
        }

        *{ box-sizing:border-box; margin:0; padding:0; }
        
        body{
            background:var(--bone);
            color:var(--ink);
            font-family:'Inter', sans-serif;
            min-height:100vh;
        }

        header.hero{
            max-width:1100px;
            margin:0 auto;
            padding:64px 32px 56px;
            display:grid;
            grid-template-columns:1.4fr 1fr;
            gap:48px;
            align-items:center;
        }

        .brand-row{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:56px;
        }

        .logo-mark{
            width:38px; height:38px;
            border-radius:50%;
            background:var(--ink);
            position:relative;
            flex-shrink:0;
        }
        .logo-mark::after{
            content:'';
            position:absolute;
            inset:9px;
            border-radius:50%;
            background:var(--amber);
        }

        .brand-name{
            font-family:'IBM Plex Mono', monospace;
            font-size:14px;
            letter-spacing:0.14em;
            text-transform:uppercase;
            color:var(--slate);
        }

        .intro-copy{ max-width:560px; }

        .eyebrow{
            font-family:'IBM Plex Mono', monospace;
            font-size:13px;
            color:var(--teal);
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:18px;
        }
        .eyebrow::before{
            content:'';
            width:22px; height:1px;
            background:var(--teal);
        }

        h1{
            font-family:'Fraunces', serif;
            font-weight:500;
            font-size:clamp(2.4rem, 5vw, 3.6rem);
            line-height:1.08;
            letter-spacing:-0.01em;
        }
        h1 .accent{
            font-style:italic;
            color:var(--teal);
        }

        .console-line{
            font-family:'IBM Plex Mono', monospace;
            font-size:16px;
            color:var(--slate);
            margin-top:22px;
            display:flex;
            align-items:center;
            gap:2px;
        }
        .console-line .prompt{ color:var(--amber); }
        .cursor{
            display:inline-block;
            width:9px; height:18px;
            background:var(--ink);
            margin-left:4px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink{ 50%{ opacity:0; } }

        .tagline{
            margin-top:22px;
            font-size:16px;
            color:var(--slate);
            line-height:1.6;
            max-width:480px;
        }

        nav.links{
            margin-top:34px;
            display:flex;
            gap:24px;
            font-family:'IBM Plex Mono', monospace;
            font-size:13px;
        }
        nav.links a{
            color:var(--ink);
            text-decoration:none;
            border-bottom:1px solid var(--line);
            padding-bottom:2px;
            transition:border-color .2s ease, color .2s ease;
        }
        nav.links a:hover{ border-color:var(--teal); color:var(--teal); }

        .portrait-frame{
            aspect-ratio:4/5;
            border:1px solid var(--line);
            border-radius:4px;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            background:
            repeating-linear-gradient(135deg, transparent 0 18px, rgba(18,23,43,0.035) 18px 19px);
        }
        .portrait-frame::before{
            content:'';
            position:absolute;
            top:14px; left:14px; right:14px; bottom:14px;
            border:1px solid var(--ink);
            border-radius:2px;
        }
        .portrait-label{
            font-family:'IBM Plex Mono', monospace;
            font-size:12px;
            letter-spacing:0.08em;
            text-transform:uppercase;
            color:var(--slate);
            text-align:center;
            padding:0 20px;
        }

        @media (max-width:720px){
            header.hero{ grid-template-columns:1fr; padding:40px 20px; }
            .portrait-frame{ max-width:280px; margin:0 auto; }
        }
        </style>
    </head>
    <body>

        <header class="hero">
            <div>
                <div class="brand-row">
                    <div class="logo-mark"></div>
                        <span class="brand-name">Raushan Kumar</span>
                    </div>

                    <div class="intro-copy">
                        <p class="eyebrow">Welcome</p>
                        <h1>I build things<br>for the <span class="accent">web.</span></h1>

                        <p class="console-line">
                            <span class="prompt">&gt;</span>&nbsp;role = "Frontend Developer"<span class="cursor"></span>
                        </p>

                        <p class="tagline">
                            A short introduction goes here — one or two sentences on who you are,
                            what you do, and the kind of work you're looking for. Keep it warm and specific.
                        </p>
                    </div>
                    <nav class="links">
                        <a href="#about">About</a>
                        <a href="#skills">Skills</a>
                        <a href="#projects">Projects</a>
                        <a href="#contact">Contact</a>
                    </nav>
                </div>
            </div>

            <div class="portrait-frame">
                <p class="portrait-label">Your photo<br>goes here</p>
            </div>
        </header>
        <main>
            <! ====== About Section ======= >
            <section class="about" id="about">
                <div class="card">

                </div>
            </section>

            <! ====== Skills Section ======= >
            <section class="skills" id="skills">

            </section>

            <! ====== Projects Section ======= >
            <section class="projects" id="projects">

            </section>

            <! ====== Contact Section ======= >
            <section class="contact" id="contact">
                
            </section>
        </main>

    </body>
</html>
